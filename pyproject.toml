[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openvla-quic"
version = "0.1.0"
description = "Standalone dense token OpenVLA with portable QuIC adapters"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.12"
authors = [
    {name = "Moo Jin Kim"},
    {name = "Karl Pertsch"},
    {name = "Siddharth Karamcheti"},
    {name = "Jiří Konečný", email = "jiri.konecny@vsb.cz"},
]
keywords = ["openvla", "quic", "vision-language-action", "fine-tuning"]
dependencies = [
    "quic-petf-vla @ git+https://github.com/kon0327/quic-peft-vla.git@4b59894c5f970649ad6a8c720f80809724de6b9d",
    "torch==2.2.0",
    "torchvision==0.17.0",
    "transformers==4.40.1",
    "tokenizers==0.19.1",
    "timm==0.9.10",
    "numpy>=1.26,<2",
    "Pillow>=10",
    "accelerate>=0.25,<1",
    "huggingface-hub>=0.19,<1",
    "sentencepiece==0.1.99",
    "safetensors>=0.4.2",
    "einops",
    "draccus==0.8.0",
    "rich",
    "tqdm>=4.66",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
rlds = [
    "tensorflow==2.15.0", "tensorflow-datasets==4.9.3",
    "tensorflow-graphics==2021.12.3", "tensorflow-metadata==1.17.2",
    "protobuf==4.21.12", "pyopenssl==26.3.0",
    "dlimp @ git+https://github.com/moojink/dlimp_openvla.git@040105d256bd28866cc6620621a3d5f7b6b91b46",
]
train = [
    "tensorflow==2.15.0", "tensorflow-datasets==4.9.3",
    "tensorflow-graphics==2021.12.3", "tensorflow-metadata==1.17.2",
    "protobuf==4.21.12", "pyopenssl==26.3.0", "peft==0.11.1", "wandb", "matplotlib", "jsonlines",
    "dlimp @ git+https://github.com/moojink/dlimp_openvla.git@040105d256bd28866cc6620621a3d5f7b6b91b46",
]
legacy-deploy = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "json-numpy"]
flash = ["flash-attn==2.5.5"]
dev = ["pytest>=7", "httpx>=0.27,<1", "build>=1", "twine>=5"]

[project.scripts]
openvla-quic = "quic_petf.cli:main"

[project.urls]
Repository = "https://github.com/kon0327/openvla-quic"
Upstream = "https://github.com/openvla/openvla"
Method = "https://github.com/kon0327/quic-peft-vla"

[tool.setuptools.packages.find]
where = ["."]
include = ["quic_petf*", "prismatic*", "experiments*"]
exclude = ["tests*", "cache*", "deploy*", "requirements*"]

[tool.setuptools.package-data]
prismatic = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/quic"]
